name: agent-review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
jobs:
  review:
    # ── 2026-07-27 Muso 拍板「方案 C」：自动评审放开到所有同仓分支 ──────────────
    # 起因：canonical PR#58（分支 fix/anchor-identity-issue-26）四项 CI 全绿、
    # mergeStateStatus CLEAN，却因原来的 startsWith(head_ref,'agent/'|'claude/')
    # 判定 SKIPPED —— 评审不跑、自动合并自然不接手，PR 无限期挂着且没有任何提示。
    #
    # 现在：所有**同仓**分支的 PR 都会被评审（人写的也能拿到反馈）。
    # 合并权仍收紧：run-review.ps1 只对 agent/* 与 claude/* 分支自动 squash merge，
    # 其余分支评审通过后只留一条「等你点合并」的评论。策略单点在 run-review.ps1。
    #
    # SECURITY（放开 if: 的同时必须补上，否则严格变差）：本 job 跑在自托管 runner
    # 并直接执行 Muso 本机的 run-review.ps1。若不限定 head repo，任何人开一个 fork
    # PR 就能触发本机执行（自托管 runner 经典事故形态）。此前是靠分支名前缀间接挡住的
    # —— 放开前缀条件后，「PR 来自本仓自身分支」成为唯一防线，必须显式保留。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mnesis-mnesis-canonical]
    steps:
      - name: reviewer
        shell: pwsh
        run: pwsh -File D:\Github\_ops\orchestration\run-review.ps1 -Pr ${{ github.event.pull_request.number }} -Repo ${{ github.repository }}
