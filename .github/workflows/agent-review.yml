name: agent-review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
jobs:
  review:
    # ── 2026-07-27 方案 C：自动评审覆盖所有同仓分支 ────────────────────────────
    # 合并权仍收紧：run-review.{ps1,sh} 只对 agent/* 与 claude/* 自动 squash merge，
    # 其余分支评审通过后只留一条「等你点合并」的评论。两机脚本已同步该策略。
    #
    # ── 2026-07-28 双机评审：runs-on 从单机标签放开到 self-hosted ──────────────
    # 起因：取消按仓分区后派活是双机了，评审却仍钉死在 Windows 一台
    # （ambrosia 实测 mnesis-local busy=true 时，闲着的 mac runner 接不了，
    # 评审排队 20 分钟）——派活的瓶颈被搬到了评审。
    # 每仓恰好两台 runner（Windows + macOS），只共享 self-hosted 标签，故用它。
    #
    # ── ⚠️ 2026-08-19 起上面这段的前提已不成立（订正见 Parthenon#808）──────────
    # 「每仓恰好两台 runner」是 07-28 的事实，**今天不是**。跨机编排已取消、Cockpit
    # 完全本地化，mac 侧（lane + 6 个 runner）已摘除：runner 经 launchctl
    # bootout+disable，plist 移入 mac 的 ~/LaunchAgents-disabled-20260819（可逆）。
    # 决策链：Parthenon commit 7b3d9122（08-22 落地「六仓全部钉给本机内核」）
    #   → Mnesis-Daedalus#460「CI 全收本机 + mac 腿关闭」，Muso 08-25 逐文件核过
    #     diff 后批准、08-26 合并。
    # 收尾：六仓那 6 条 macOS runner 注册已于 2026-09-01 经 Muso 批准后删除
    # （删除后六仓复核 `gh api .../actions/runners` 均为 total_count=1）。在此之前
    # 它们以 offline 状态留在列表里，把每仓的容量虚报了一倍。
    # 现在 `runs-on: [self-hosted]` **唯一**能匹配到本仓那台 Windows runner，
    # 等价于钉死 Windows；下面 `runner.os == 'macOS'` 那一段是**当前不可达的死代码**。
    #
    # 死代码刻意保留、不在本次订正里删，两条理由：
    #   ① 恢复 mac 跨机是 OPERATIONS-GUIDE §5 的恢复开关（plist 移回 + launchctl
    #      enable/bootstrap），需 Muso 批准；一旦恢复，这一段要原样回到岗位。
    #   ② Parthenon 的 tests/test_review_entrypoint_consistency.py::test_both_legs_exist
    #      对裸 `[self-hosted]` 硬要求 windows/mac **双腿齐备**。删掉 mac 腿会让本仓
    #      main 变红 —— Daedalus 钉死 Windows 后正是这样撞红的（Parthenon#797 正在
    #      为此加 WINDOWS_ONLY 登记表）。
    # （那 6 条 macOS 注册已如上删除；删下面的 macOS 分支仍是**单独的决定**，不在本卡范围。）
    #
    # SECURITY：本 job 在自托管 runner 上直接执行本机脚本。fork PR 必须挡住，
    # 否则任何人开个 fork PR 就能触发本机执行（自托管 runner 经典事故形态）。
    if: github.event.pull_request.head.repo.full_name == github.repository
    # CI_POLICY R2 例外·角色标签 mnesis-core（2026-09-25，Muso 定「只能在主节点跑的作业钉到主节点」，
    # Mnesis-Labs/Parthenon#878）。评审是控制面：入口是主节点的 Parthenon 检出（cockpit/worker/run-review.ps1），要读主节点磁盘上的
    # bot.pat 与网关 token（engine.local.ps1），NeXT 上都没有
    # （与其它仓统一：评审身份与密钥只放主节点）
    # mnesis-core 是角色标签（只挂在主节点那台 runner 上），不是机器名；普通测试作业仍是裸 [self-hosted]、两台分担。
    # 撤销条件：NeXT 具备同等环境（评审入口/密钥或 Android 工具链）并按 #878 对照验证通过后，改回原 runs-on。
    runs-on: [self-hosted, Windows, X64, mnesis-core]
    steps:
      # 两台机器的评审脚本路径与解释器不同，按 runner.os 分派。
      # 参数签名一致（-Pr / -Repo），行为由各自脚本保证一致。
      # ⚠️ 2026-08-19 起实际只剩 Windows 一台在接活（见文件头订正块），
      # 所以这里的"分派"当前恒定走 Windows 腿。
      # ── 2026-09-16：入口按机器解析，不再写死 D:\Github ──────────────────────
      # 与 Parthenon#854 同形的改动（那边已合并并实测）。起因：本仓此前只有 1 个
      # runner、且六仓的 runner 全在 nextscene-core 上（CI_POLICY R3 早已不满足），
      # Parthenon 实测排过 26 小时的队。第二台 Windows 机器（NeXT）要能分担，就绕不开
      # 这一行 —— `runs-on` 按 R1 是裸 `[self-hosted]`，**GitHub 的模型里没有办法让某台
      # runner 只接一部分作业**：NeXT 一注册，本作业就会随机落到它头上，而它上面连
      # D: 盘都没有。要挑作业只能在作业侧加节点标签，那是 R2 禁止、`ci_policy_lint.py`
      # 判 error 的 node-pin。所以选择让新机器也能评审。
      #
      # 解析顺序：机器级环境变量 MNESIS_REPO_ROOT → 回落 D:\Github（core 上无需设变量，
      # 行为与改动前逐字一致）。`cockpit/worker/common.ps1` 本来就认这个变量。
      # **找不到脚本一律当场红**，绝不静默跳过：这是评审门，fail-open 等于把「没评审」
      # 伪装成「评审通过」。
      #
      # 守卫对齐：Parthenon 的 tests/test_review_entrypoint_consistency.py 以正则
      # `[^\s'"`;|]*run-review\.(ps1|sh)` 提取落点，并要求归一化后含
      # `/parthenon/cockpit/worker/run-review.` —— 所以 `$root` 与 `Parthenon` 之间
      # 那个反斜杠不能省，否则六仓一致性检查会红。
      - name: reviewer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:MNESIS_REPO_ROOT
          if (-not $root) { $root = 'D:\Github' }
          $script = "$root\Parthenon\cockpit\worker\run-review.ps1"
          if (-not (Test-Path $script)) {
            Write-Host "::error::本机（$env:COMPUTERNAME）找不到评审器 $script"
            Write-Host '这台 runner 没有铺 Parthenon 生产检出，或 MNESIS_REPO_ROOT 指错了。'
            Write-Host '接入清单见 Parthenon 的 ops/2026-09-15-second-windows-node.md。'
            exit 1
          }
          pwsh -File $script -Pr ${{ github.event.pull_request.number }} -Repo ${{ github.repository }}
      # ⚠️ 死代码（2026-08-19 起）：mac 腿已摘除，本 step 的 `if` 恒为 false。
      # 保留不删的理由见文件头 08-19 订正块。
      - name: reviewer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash "$HOME/Documents/GitHub/Parthenon/cockpit/worker/run-review.sh" -Pr ${{ github.event.pull_request.number }} -Repo ${{ github.repository }}
