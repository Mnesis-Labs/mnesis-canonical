name: CI

on:
  # push 保持 "**"：这是冲突 PR 唯一的 CI 兜底。
  # PR 一旦与 base 冲突，GitHub 算不出 merge commit，pull_request 事件就完全
  # 不触发；#62 曾把 push 收窄到 [main]，实测冲突期间该 PR no checks reported，
  # 连「这份代码本身是好是坏」都无从判断。Muso 2026-07-28 拍板保留兜底。
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 同一分支/PR 只保留最新一次 run，旧的排队或在跑的直接取消——连续推送时后推的
# 提交才是待验对象，前一版的结果无人会看。这是控制重复 run 的主要手段：
# push 与 pull_request 双触发导致同一 commit 跑两套（group 不同、互不取消），
# 但至少同一 group 内不会随推送次数堆积。
#
# cancel-in-progress 按「分支是不是 main」判断，不能按事件类型判断：
# 上一版写的是 event_name == 'pull_request'，其前提是 push 只发生在 main 上；
# 既然兜底恢复，分支 push 也要能取消旧 run，否则兜底 run 会越堆越多。
#   pull_request → github.ref = refs/pull/<n>/merge ≠ main → 取消
#   push 到分支  → refs/heads/<branch>            ≠ main → 取消
#   push 到 main → refs/heads/main                       → 不取消，
#                  每个已合并 commit 都要留下自己的 CI 记录
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# ── pip 索引：阿里云为主、腾讯云备份（2026-08-09，#103）──────────────────────
# 为什么必须在这里设：本仓的 pip 调用（tests/test_wheel_install.py 的
# `python -m pip wheel`、scripts/release_check.py）**都不带 --index-url**，
# 走的是 runner 机器的全局 pip 配置。而那份全局配置指向清华：
#
#   global.index-url = https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
#
# 清华从 2026-08-08 起按 IP 封禁本编排机，症状是 `from versions: none`
# ——**索引一个版本都不返回**，不是版本不匹配。#103 记录了一晚三次，
# 分别打红 test_wheel_install 与 release_check，且与代码无关。
#
# 本机实测（curl --noproxy '*' 直连，出口 223.166.95.54 中国上海联通）：
#   mirrors.tuna.tsinghua.edu.cn/pypi/web/simple   403   ← 封禁页
#   mirrors.aliyun.com/pypi/simple                 200
#   mirrors.cloud.tencent.com/pypi/simple          200
#
# 放 workflow env 而不是改机器全局 pip 配置的理由：这样它**可版本控制、可评审、
# 随仓走**，换机器不会丢；而改全局配置是不可见的机器状态，下次换 runner 又是一个坑。
# PIP_INDEX_URL / PIP_EXTRA_INDEX_URL 是 pip 官方认的环境变量，优先级高于配置文件，
# 因此不必动那份全局配置就能覆盖它。
#
# ⚠️ 国内镜像必须直连：经代理出口是境外 IP，国内镜像对境外 IP 更容易 403 ——
# 那会变成同一症状的第二条成因。runner 的 NO_PROXY 需含这两个域名。
#
# 同源修复见 Mnesis-Daedalus ci-selfhosted.yml 的 UV_INDEX_URL（那条走 uv 路径，
# 与本条的 pip 路径是**两条独立代码路径**，改一处不覆盖另一处 —— #103 就是这么漏的）。
env:
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  PIP_EXTRA_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple/
  # 镜像抽风时给 pip 自己的重试留余量（默认只重试 5 次、间隔很短）
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"

# ── 2026-07-28 双机化（CI_POLICY R1）──────────────────────────────────────────
# 此前三个 job 全钉 [self-hosted, Windows, X64]，mac runner 接不了。实测代价：
# 本仓一度 6 个 run 同时排队、最老的等 50 分钟，而同仓 mac runner 全程 busy=false。
#
# 原来钉 Windows 的真实原因是 mac 侧 homebrew Python 的 PEP 668 让 pip install 被拒
# （CI_POLICY §290 记为「mac 腿未闭环」）。现在两台机器都装了 uv，uv 建的 venv 完全
# 绕开 PEP 668，且 uv 的命令在 Windows / macOS 上完全一致 —— 不需要按 shell 分支。
#
# 放开前已在两台机器上实跑同一组步骤：
#   mac(nextscene-mac01, python3.14 + uv 0.11.32)  : ruff 通过 / 320 passed / contracts OK / embodiment OK
#   win(nextscene-core,  python3.13 + uv 0.11.28)  : ruff 通过 / 320 passed / contracts OK / embodiment OK
#
# `uv venv --seed` 的 --seed 不能去掉：不带它建出来的 venv 没有 pip，
# tests/test_wheel_install.py 里的 `python -m pip wheel` 会 "No module named pip" 而失败
# （实测 mac 上 319 passed / 1 failed，加 --seed 后 320 passed）。
#
# 仍然不用 actions/setup-python：它会往 runner 的 tool cache 重装 Python，在自托管
# Windows 上因权限/占用而失败（实测 canonical#59 三个 job 全挂）。uv 用机器上已有的
# Python 建 venv，没有这个问题，且顺带把依赖装进项目级 venv 而不是污染全局环境。
#
# ── 自托管腿为什么手写 checkout 而不用 actions/checkout（2026-08-19，#126）─────
# main 连续红 4 小时，四个 job 里三个**在 "Set up job" 就死了**，一行仓内代码都没跑：
#
#   Failed to download action
#     'https://codeload.github.com/actions/checkout/zip/11d5960a…'
#   Response status code does not indicate success: 429 (Too Many Requests).
#   The SSL connection could not be established.   ← mac 腿是这条
#
# 即 run 32040618031。同一 run 里 `Ruff · Pytest` 是绿的 —— 代码没问题，
# 挂的是 runner 取 action 那一步。这类红最坑的地方是**它长得像代码有问题**：
# 默认分支红着，之后每个 PR 都继承这条失败，排查时每个 PR 都像自己有毛病。
#
# 为什么会 429：runner 每个 job 都会把 `_work/_actions/<owner>/<repo>/<ref>`
# 删掉重下，不是下一次全仓复用。本仓 ci.yml 有 4 个 job，push 与 pull_request
# 还双触发，一次推送就是 8 次 codeload 拉取；两台自托管 runner 又都在国内、
# 经同一个代理出口访问 codeload —— 打到限流是迟早的事，不是偶发。
# （同源病灶见本文件上面那段 pip 镜像注释 #103：国内出口 + 境外源 = 反复假红。）
#
# 手写 checkout 同时消掉症状与病因：这一步只用 runner 上已有的 git 打一次
# `--depth=1` 取 `$GITHUB_SHA`，完全不碰 codeload，也就不再给限流添柴。
# 代价是 4 个 job 各抄一遍这 10 行 —— 本地 composite action（`./.github/actions/*`）
# 救不了这个场景，因为用它之前仓库必须已经 checkout 出来，正是先有鸡还是先有蛋。
#
# 只改自托管腿。ci-fast.yml 跑在 GitHub 托管 runner 上，取 action 走内网、
# 从没因此红过，保持 actions/checkout 不动。
#
# ── Windows 腿的 `shell: bash` 陷阱（2026-08-19，#126 追）─────────────────────
# 上面手写 checkout 首版直接用 `shell: bash`，在 GitHub 托管 runner / mac 自托管
# runner 上没问题，但这台 Windows 自托管 runner 的 actions-runner 服务进程 PATH
# 里 C:\Windows\System32\bash.exe（WSL 转发桩）排在 Git 的 bash.exe 前面 ——
# 交互式用户会话看不到这个顺序，只有服务进程的 PATH 是这样。`shell: bash` 解析
# 到那个桩，桩把 Actions 写的 Windows 风格脚本临时文件路径当 WSL 路径处理，
# 报 "No such file or directory"，job 几秒内就死。比原来的 429 更隐蔽：不是
# 每次必红，落到 mac runner 的一半照样绿，看起来像间歇性 flaky。
#
# 试过把 `shell:` 直接钉成 Git bash.exe 的绝对路径（'C:\Program Files\Git\bin\
# bash.exe ... {0}'），撞上 actions/runner 已知问题：自定义 shell 命令里带盘符
# 的绝对路径会让 runner 内部 Path.Combine 抛 "Second path fragment must not be
# a drive or UNC name"，job 同样秒挂。
#
# 改用 $GITHUB_PATH：在 checkout 之前加一步只在 Windows 上跑、把 Git 的 bin 目录
# 写进 $GITHUB_PATH，对本 job 剩余步骤生效的 PATH 前置一段——不碰 `shell:` 语法，
# 不撞上面那个 runner bug，之后同一个 `shell: bash` 步骤在两种 OS 上都能正确解析
# 到真正的 Git Bash，四个 job 也不用各抄一份 OS 分支的 checkout 脚本。
jobs:
  test:
    name: Ruff · Pytest
    runs-on: [self-hosted]
    steps:
      # 见文件头「Windows 腿的 shell: bash 陷阱」（#126）
      - name: Prepend Git Bash to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
      # 手写 checkout：见文件头「自托管腿为什么手写 checkout」（#126）
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          # 上一版 actions/checkout 会把带 token 的 extraheader 写进 .git/config；
          # 那个 token 早已过期，留着会让下面的 fetch 带着坏 Authorization 头去请求。
          git init -q .
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 2>/dev/null \
            || git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for n in 1 2 3; do
            if git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"; then ok=1; break; fi
            sleep $((n * 10))
          done
          [ "${ok:-}" = 1 ]
          git checkout -q --detach FETCH_HEAD
          git clean -qffdx
      - name: Toolchain
        run: uv --version
      - name: Venv + deps
        run: uv venv --seed
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run pytest -q

  contracts-check:
    name: Contracts integrity
    runs-on: [self-hosted]
    steps:
      # 见文件头「Windows 腿的 shell: bash 陷阱」（#126）
      - name: Prepend Git Bash to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
      # 手写 checkout：见文件头「自托管腿为什么手写 checkout」（#126）
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 2>/dev/null \
            || git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for n in 1 2 3; do
            if git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"; then ok=1; break; fi
            sleep $((n * 10))
          done
          [ "${ok:-}" = 1 ]
          git checkout -q --detach FETCH_HEAD
          git clean -qffdx
      - name: Venv + deps
        run: uv venv --seed
      - run: uv pip install -e ".[dev]"
      - run: uv run python -m mnesis_canonical.contracts_check

  embodiment-check:
    name: Embodiment registry
    runs-on: [self-hosted]
    steps:
      # 见文件头「Windows 腿的 shell: bash 陷阱」（#126）
      - name: Prepend Git Bash to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
      # 手写 checkout：见文件头「自托管腿为什么手写 checkout」（#126）
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 2>/dev/null \
            || git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for n in 1 2 3; do
            if git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"; then ok=1; break; fi
            sleep $((n * 10))
          done
          [ "${ok:-}" = 1 ]
          git checkout -q --detach FETCH_HEAD
          git clean -qffdx
      - name: Venv + deps
        run: uv venv --seed
      - run: uv pip install -e ".[dev]"
      - run: uv run python -m mnesis_canonical.embodiment_check

  release-check:
    name: Release checklist §2-§6
    runs-on: [self-hosted]
    steps:
      # 见文件头「Windows 腿的 shell: bash 陷阱」（#126）
      - name: Prepend Git Bash to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
      # 手写 checkout：见文件头「自托管腿为什么手写 checkout」（#126）
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 2>/dev/null \
            || git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for n in 1 2 3; do
            if git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"; then ok=1; break; fi
            sleep $((n * 10))
          done
          [ "${ok:-}" = 1 ]
          git checkout -q --detach FETCH_HEAD
          git clean -qffdx
      - name: Venv + deps
        run: uv venv --seed
      - run: uv pip install -e ".[dev]"
      # 逐项跑 docs/RELEASE_CHECKLIST_v1.0.md §2–§6，任一失败整体 exit 1。
      # 走 uv run：脚本内部用 sys.executable 拉起子进程，并按 PATH 找 ruff /
      # pyright，两者都要落在 venv 里才算数。
      - run: uv run python scripts/release_check.py
