name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Ruff · Pytest
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      # 自托管 runner 用机器上预装的 Python（CI_POLICY R1）。
      # 不用 actions/setup-python：它会往 runner 的 tool cache 重装 Python，
      # 在自托管 Windows 上因权限/占用而失败（实测 canonical#59 三个 job 全挂）。
      - name: Show Python
        shell: bash
        run: python --version && pip --version
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  contracts-check:
    name: Contracts integrity
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      # 自托管 runner 用机器上预装的 Python（CI_POLICY R1）。
      # 不用 actions/setup-python：它会往 runner 的 tool cache 重装 Python，
      # 在自托管 Windows 上因权限/占用而失败（实测 canonical#59 三个 job 全挂）。
      - name: Show Python
        shell: bash
        run: python --version && pip --version
      - run: pip install -e ".[dev]"
      - run: python -m mnesis_canonical.contracts_check

  embodiment-check:
    name: Embodiment registry
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      # 自托管 runner 用机器上预装的 Python（CI_POLICY R1）。
      # 不用 actions/setup-python：它会往 runner 的 tool cache 重装 Python，
      # 在自托管 Windows 上因权限/占用而失败（实测 canonical#59 三个 job 全挂）。
      - name: Show Python
        shell: bash
        run: python --version && pip --version
      - run: pip install -e ".[dev]"
      - run: python -m mnesis_canonical.embodiment_check