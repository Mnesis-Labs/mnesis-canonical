name: CI

on:
  # push 保持 "**"：这是冲突 PR 唯一的 CI 兜底。
  # PR 一旦与 base 冲突，GitHub 算不出 merge commit，pull_request 事件就完全
  # 不触发；#62 曾把 push 收窄到 [main]，实测冲突期间该 PR no checks reported，
  # 连「这份代码本身是好是坏」都无从判断。Muso 2026-07-28 拍板保留兜底。
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 同一分支/PR 只保留最新一次 run，旧的排队或在跑的直接取消——连续推送时后推的
# 提交才是待验对象，前一版的结果无人会看。这是控制重复 run 的主要手段：
# push 与 pull_request 双触发导致同一 commit 跑两套（group 不同、互不取消），
# 但至少同一 group 内不会随推送次数堆积。
#
# cancel-in-progress 按「分支是不是 main」判断，不能按事件类型判断：
# 上一版写的是 event_name == 'pull_request'，其前提是 push 只发生在 main 上；
# 既然兜底恢复，分支 push 也要能取消旧 run，否则兜底 run 会越堆越多。
#   pull_request → github.ref = refs/pull/<n>/merge ≠ main → 取消
#   push 到分支  → refs/heads/<branch>            ≠ main → 取消
#   push 到 main → refs/heads/main                       → 不取消，
#                  每个已合并 commit 都要留下自己的 CI 记录
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# ── 2026-07-28 双机化（CI_POLICY R1）──────────────────────────────────────────
# 此前三个 job 全钉 [self-hosted, Windows, X64]，mac runner 接不了。实测代价：
# 本仓一度 6 个 run 同时排队、最老的等 50 分钟，而同仓 mac runner 全程 busy=false。
#
# 原来钉 Windows 的真实原因是 mac 侧 homebrew Python 的 PEP 668 让 pip install 被拒
# （CI_POLICY §290 记为「mac 腿未闭环」）。现在两台机器都装了 uv，uv 建的 venv 完全
# 绕开 PEP 668，且 uv 的命令在 Windows / macOS 上完全一致 —— 不需要按 shell 分支。
#
# 放开前已在两台机器上实跑同一组步骤：
#   mac(nextscene-mac01, python3.14 + uv 0.11.32)  : ruff 通过 / 320 passed / contracts OK / embodiment OK
#   win(nextscene-core,  python3.13 + uv 0.11.28)  : ruff 通过 / 320 passed / contracts OK / embodiment OK
#
# `uv venv --seed` 的 --seed 不能去掉：不带它建出来的 venv 没有 pip，
# tests/test_wheel_install.py 里的 `python -m pip wheel` 会 "No module named pip" 而失败
# （实测 mac 上 319 passed / 1 failed，加 --seed 后 320 passed）。
#
# 仍然不用 actions/setup-python：它会往 runner 的 tool cache 重装 Python，在自托管
# Windows 上因权限/占用而失败（实测 canonical#59 三个 job 全挂）。uv 用机器上已有的
# Python 建 venv，没有这个问题，且顺带把依赖装进项目级 venv 而不是污染全局环境。
jobs:
  test:
    name: Ruff · Pytest
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: uv --version
      - name: Venv + deps
        run: uv venv --seed
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run pytest -q

  contracts-check:
    name: Contracts integrity
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Venv + deps
        run: uv venv --seed
      - run: uv pip install -e ".[dev]"
      - run: uv run python -m mnesis_canonical.contracts_check

  embodiment-check:
    name: Embodiment registry
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Venv + deps
        run: uv venv --seed
      - run: uv pip install -e ".[dev]"
      - run: uv run python -m mnesis_canonical.embodiment_check

  release-check:
    name: Release checklist §2-§6
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Venv + deps
        run: uv venv --seed
      - run: uv pip install -e ".[dev]"
      # 逐项跑 docs/RELEASE_CHECKLIST_v1.0.md §2–§6，任一失败整体 exit 1。
      # 走 uv run：脚本内部用 sys.executable 拉起子进程，并按 PATH 找 ruff /
      # pyright，两者都要落在 venv 里才算数。
      - run: uv run python scripts/release_check.py
