# ── Release workflow ──────────────────────────────────────────────────────────
# Triggered by pushing a version tag matching `v<major>.<minor>.<patch>`.
# 1. Build sdist + wheel.
# 2. Run the full release checklist (§2–§6).
# 3. Create a GitHub Release with changelog notes.
# 4. Publish to PyPI.
#
# PyPI trust: publishing is gated on a passing release check AND a signed tag.
# The PYPI_TOKEN secret must be set in the repo or org.
#
# §7 (git tag) and §8 (GitHub Release + PyPI) of RELEASE_CHECKLIST_v1.0.md.
# ──────────────────────────────────────────────────────────────────────────────

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write  # needed for creating GitHub Releases

jobs:
  check-and-publish:
    name: Release checklist + publish
    runs-on: [self-hosted]
    steps:
      # 见 ci.yml 文件头「Windows 腿的 shell: bash 陷阱」（#126）
      - name: Prepend Git Bash to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
      # 手写 checkout，不用 actions/checkout：自托管 runner 取 action 走 codeload，
      # 国内出口打到 429 / SSL 失败会让 job 在 "Set up job" 就死掉，一行代码都没跑。
      # 完整原委见 ci.yml 文件头「自托管腿为什么手写 checkout」（#126）。
      # tag 名从 $GITHUB_REF_NAME 拿，不依赖 fetch 到 tag，所以 --no-tags 够用。
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 2>/dev/null \
            || git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for n in 1 2 3; do
            if git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"; then ok=1; break; fi
            sleep $((n * 10))
          done
          [ "${ok:-}" = 1 ]
          git checkout -q --detach FETCH_HEAD
          git clean -qffdx

      - name: Toolchain
        run: uv --version

      - name: Venv + deps
        run: uv venv --seed

      - name: Install
        run: uv pip install -e ".[dev]"

      # ── §2–§6: release checklist (contracts, embodiments, lint, tests, smoke) ──
      - name: Release checklist §2–§6
        run: uv run python scripts/release_check.py

      # ── Build sdist + wheel ──
      - name: Build
        run: uv run python -m build

      # ── §8: GitHub Release ──
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Extract the changelog section for this version
          CHANGELOG_SECTION=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) { exit } }
            /^## \['"$VERSION"'\]/ { found=1; next }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$CHANGELOG_SECTION" ]; then
            NOTES="Release ${TAG}"
          else
            NOTES="${CHANGELOG_SECTION}"
          fi
          gh release create "$TAG" \
            --title "mnesis-canonical ${TAG}" \
            --notes "$NOTES" \
            dist/*.tar.gz dist/*.whl

      # ── PyPI publish ──
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: uv run twine upload dist/*